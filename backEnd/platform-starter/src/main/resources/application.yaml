spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    #    active: prod
    active: test
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 7529
  servlet:
    context-path: /api
  tomcat:
    # 允许 URL 中编码的斜杠 %2F 透传，避免 MinIO/本地文件 fileId 含 '/' 时 Tomcat 返回 400
    encoded-solidus-handling: PASS_THROUGH


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    mapper-locations: classpath*:/**/mapper/**/*.xml


############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

# 文件存储配置：local / minio / oss / cos / s3
storage:
  type: minio
  local:
    base-path: ${user.dir}/uploads
  minio:
    endpoint: http://localhost:9000
    bucket: mokatest
    access-key: minioadmin
    secret-key: minioadmin
  # 阿里云 OSS 配置示例（需引入 SDK 后生效）
  # oss:
  #   endpoint: oss-cn-hangzhou.aliyuncs.com
  #   bucket: your-bucket
  #   access-key: your-ak
  #   secret-key: your-sk
  # 腾讯云 COS 配置示例
  # cos:
  #   region: ap-guangzhou
  #   bucket: your-bucket-1250000000
  #   access-key: your-ak
  #   secret-key: your-sk
  #   secure: true
  # AWS S3 配置示例
  # s3:
  #   region: ap-southeast-1
  #   bucket: your-bucket
  #   access-key: your-ak
  #   secret-key: your-sk
#   MinIO 配置示例
